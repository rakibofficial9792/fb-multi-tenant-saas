<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FB Post Collector</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

</head>

<body class="dark bg-gray-900 transition-all duration-300">

  <div class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- HEADER -->

    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow p-6 mb-6 transition-all duration-300">

      <div class="flex items-center justify-between flex-wrap gap-4">

        <div class="flex items-center gap-4">

          <img
            src="rakib.png.png"
            alt="MD Rakib"
            class="w-16 h-16 rounded-full object-cover border-2 border-white shadow"
          />

          <div>

            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
              FB Post Collector
            </h1>

            <p class="text-gray-500 dark:text-gray-300 mt-2">
              Powered by MD Rakib
            </p>

          </div>

        </div>

        <!-- DARK MODE BUTTON -->

        <button
          onclick="document.documentElement.classList.toggle('dark')"
          class="bg-black dark:bg-white text-white dark:text-black px-4 py-2 rounded-xl transition-all duration-300"
        >
          🌙
        </button>

      </div>

    </div>

    <!-- STATS -->

    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">

      <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow transition-all duration-300">

        <h2 class="text-gray-500 dark:text-gray-300 text-sm">
          Owner
        </h2>

        <p class="text-3xl font-bold mt-2 text-gray-900 dark:text-white">
          1
        </p>

      </div>

      <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow transition-all duration-300">

        <h2 class="text-gray-500 dark:text-gray-300 text-sm">
          Employers
        </h2>

        <p class="text-3xl font-bold mt-2 text-gray-900 dark:text-white">
          1
        </p>

      </div>

      <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow transition-all duration-300">

        <h2 class="text-gray-500 dark:text-gray-300 text-sm">
          Total Posts
        </h2>

        <p class="text-3xl font-bold mt-2 text-gray-900 dark:text-white">
          3000
        </p>

      </div>

      <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow transition-all duration-300">

        <h2 class="text-gray-500 dark:text-gray-300 text-sm">
          Published
        </h2>

        <p class="text-3xl font-bold mt-2 text-green-500">
          1800
        </p>

      </div>

      <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow transition-all duration-300">

        <h2 class="text-gray-500 dark:text-gray-300 text-sm">
          UnPublished
        </h2>

        <p class="text-3xl font-bold mt-2 text-red-500">
          740
        </p>

      </div>

    </div>

    <!-- FILTERS -->

    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow p-4 mb-6 transition-all duration-300">

      <div class="flex flex-wrap gap-3">

        <button class="bg-black text-white px-4 py-2 rounded-xl">
          Today
        </button>

        <button class="bg-gray-200 dark:bg-gray-700 dark:text-white px-4 py-2 rounded-xl">
          7 Days
        </button>

        <button class="bg-gray-200 dark:bg-gray-700 dark:text-white px-4 py-2 rounded-xl">
          30 Days
        </button>

        <button class="bg-gray-200 dark:bg-gray-700 dark:text-white px-4 py-2 rounded-xl">
          Scheduled
        </button>

        <button class="bg-gray-200 dark:bg-gray-700 dark:text-white px-4 py-2 rounded-xl">
          Published
        </button>

        <button class="bg-gray-200 dark:bg-gray-700 dark:text-white px-4 py-2 rounded-xl">
          UnPublished
        </button>

      </div>

    </div>

    <!-- POSTS TABLE -->

    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow overflow-hidden transition-all duration-300">

      <div class="p-4 border-b dark:border-gray-700 flex flex-col md:flex-row gap-4 md:items-center md:justify-between">

        <h2 class="font-bold text-2xl text-gray-900 dark:text-white">
          Latest Posts
        </h2>

        <div class="flex gap-3 flex-wrap">

          <input
            type="text"
            placeholder="Search time... (e.g. MAY 5 AT 1:00 PM)"
            class="border dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-xl px-4 py-2 w-full md:w-auto"
          />

          <select class="border dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-xl px-4 py-2">

            <option>
              10 Posts
            </option>

            <option>
              25 Posts
            </option>

            <option>
              50 Posts
            </option>

            <option>
              100 Posts
            </option>

          </select>

        </div>

      </div>

      <div class="overflow-x-auto">

        <table class="w-full min-w-[1200px]">

          <thead class="bg-gray-100 dark:bg-gray-700 dark:text-white">

            <tr>

              <th class="text-left p-4">
                Image
              </th>

              <th class="text-left p-4">
                Caption
              </th>

              <th class="text-left p-4">
                Time
              </th>

              <th class="text-left p-4">
                Status
              </th>

              <th class="text-left p-4">
                Schedule
              </th>

              <th class="text-left p-4">
                Post ID
              </th>

              <th class="text-left p-4">
                Action
              </th>

            </tr>

          </thead>

          <tbody id="posts-table">

          </tbody>

        </table>

      </div>

      <!-- BOTTOM ACTIONS -->

      <div class="p-6 border-t dark:border-gray-700">

        <div class="flex flex-wrap justify-center gap-4">

          <button class="bg-black dark:bg-white text-white dark:text-black px-6 py-3 rounded-2xl">
            Collect Posts
          </button>

          <button class="bg-blue-600 text-white px-6 py-3 rounded-2xl">
            Load More Posts
          </button>

          <button class="bg-black dark:bg-white text-white dark:text-black px-6 py-3 rounded-2xl">
            Export CSV
          </button>

        </div>

      </div>

    </div>

  </div>

  <script>

    function copyPostId(id) {

      navigator.clipboard.writeText(id);

      alert("Post ID Copied: " + id);

    }

  </script>
<script>

  const API_BASE = "https://fb-multi-tenant-saas.onrender.com"

  function copyPostId(id) {

    navigator.clipboard.writeText(id)

    alert("Post ID Copied: " + id)

  }

  async function loadPosts() {

    try {

      const response = await fetch(
        `${API_BASE}/posts/2`,
        {
          headers: {
            Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjbGllbnRfaWQiOjIsInJvbGUiOiJjbGllbnQiLCJleHAiOjE3ODEzODU0MDB9.hixoY-R1tARXWAnpPcbh1sX4PnguZaILXoRpjsK_vEs"
          }
        }
      )

      const data = await response.json()

      const table = document.getElementById("posts-table")

      table.innerHTML = ""

      data.forEach(post => {

        table.innerHTML += `
          <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-all duration-300">

            <td class="p-4">
              <img
                src="${post.image_url || 'https://placehold.co/100x100'}"
                class="w-20 h-20 rounded-2xl object-cover"
              />
            </td>

            <td class="p-4 max-w-sm text-gray-900 dark:text-white">
              ${post.caption || 'No Caption'}
            </td>

            <td class="p-4 whitespace-nowrap text-gray-900 dark:text-white">
              ${post.created_time || 'No Time'}
            </td>

            <td class="p-4">
              <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
                Published
              </span>
            </td>

            <td class="p-4 whitespace-nowrap text-gray-900 dark:text-white">
              Scheduled
            </td>

            <td class="p-4 font-mono text-sm text-gray-900 dark:text-white">
              ${post.post_id}
            </td>

            <td class="p-4">
              <button
                onclick="copyPostId('${post.post_id}')"
                class="bg-black dark:bg-white text-white dark:text-black px-4 py-2 rounded-xl"
              >
                Copy ID
              </button>
            </td>

          </tr>
        `

      })

    } catch (error) {

      console.log(error)

    }

  }

  loadPosts()

</script>
</body>

</html>
