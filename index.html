<script>

const API_BASE = "https://fb-multi-tenant-saas.onrender.com"

const TOKEN = localStorage.getItem("token") || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjbGllbnRfaWQiOjIsInJvbGUiOiJjbGllbnQiLCJleHAiOjE3ODE0MzEzNzJ9.XkP6zWsPcvIxrOqF3IUoywK_nofRpDaFEU7ydd-sphE"

let allPosts = []
let currentFilter = 'all'
let isDark = true

function toggleTheme() {

  isDark = !isDark

  document.documentElement.classList.toggle('dark', isDark)

  document.getElementById('theme-btn').textContent =
    isDark ? '🌙' : '☀️'
}

function showToast(msg) {

  const t = document.getElementById('toast')

  t.textContent = msg

  t.style.opacity = '1'

  setTimeout(() => {
    t.style.opacity = '0'
  }, 2500)
}

function copyPostId(id) {

  navigator.clipboard.writeText(id)

  showToast("✅ Copied")
}

function setFilter(filter) {

  currentFilter = filter

  document.querySelectorAll('.filter-btn').forEach(btn => {

    btn.className =
      'filter-btn px-4 py-2 rounded-xl text-sm ' +
      (
        btn.dataset.filter === filter
        ? 'active-filter'
        : 'inactive-filter'
      )
  })

  renderTable(allPosts)
}

function showState(state) {

  const ids = [
    'loading-state',
    'error-state',
    'empty-state',
    'table-wrapper'
  ]

  ids.forEach(id => {

    document.getElementById(id).classList.add('hidden')

    document.getElementById(id).classList.remove('flex')
  })

  const target = {
    loading: 'loading-state',
    error: 'error-state',
    empty: 'empty-state',
    table: 'table-wrapper'
  }[state]

  document.getElementById(target).classList.remove('hidden')

  if (state !== 'table') {

    document.getElementById(target).classList.add('flex')
  }
}

function isScheduled(post) {

  if (!post.post_time) return false

  return new Date(post.post_time).getTime() > Date.now()
}

function renderTable(posts) {

  const search =
    document.getElementById('search-input')
    .value
    .toLowerCase()

  const limit = parseInt(
    document.getElementById('limit-select').value
  )

  const now = new Date()

  let filtered = [...posts]

  filtered = filtered.filter(post => {

    const cap =
      (post.caption || '').toLowerCase()

    const pid =
      (post.post_id || '').toLowerCase()

    if (
      search &&
      !cap.includes(search) &&
      !pid.includes(search)
    ) {
      return false
    }

    const pt = new Date(post.post_time)

    if (currentFilter === 'today') {
      return pt.toDateString() === now.toDateString()
    }

    if (currentFilter === '7days') {
      return (now - pt) <= 7 * 24 * 60 * 60 * 1000
    }

    if (currentFilter === '30days') {
      return (now - pt) <= 30 * 24 * 60 * 60 * 1000
    }

    if (currentFilter === 'published') {
      return !isScheduled(post)
    }

    if (currentFilter === 'scheduled') {
      return isScheduled(post)
    }

    return true
  })

  filtered = filtered.slice(0, limit)

  if (!filtered.length) {

    showState('empty')

    return
  }

  showState('table')

  document.getElementById('posts-table').innerHTML =
    filtered.map(post => {

      const scheduled = isScheduled(post)

      const status = scheduled
        ? `<span class="bg-blue-900 text-blue-300 px-2 py-1 rounded-full text-xs">🔵 Scheduled</span>`
        : `<span class="bg-green-900 text-green-300 px-2 py-1 rounded-full text-xs">✅ Published</span>`

      return `
        <tr class="border-b border-gray-700 hover:bg-gray-750 fade-in">

          <td class="p-4">
            <img
              src="${post.image_url || 'https://placehold.co/64'}"
              class="w-14 h-14 rounded-xl object-cover"
            />
          </td>

          <td class="p-4 max-w-xs text-sm text-gray-300">
            ${(post.caption || 'No Caption').substring(0, 100)}
          </td>

          <td class="p-4 text-xs text-gray-400 whitespace-nowrap">
            ${
              post.post_time
              ? new Date(post.post_time).toLocaleString()
              : '—'
            }
          </td>

          <td class="p-4">
            ${status}
          </td>

          <td class="p-4 font-mono text-xs text-gray-400">
            ${post.post_id || '—'}
          </td>

          <td class="p-4">
            <button
              onclick="copyPostId('${post.post_id}')"
              class="bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded-xl text-xs"
            >
              Copy ID
            </button>
          </td>

        </tr>
      `
    }).join('')
}

async function collectPosts() {

  const btn =
    document.getElementById('collect-btn')

  btn.disabled = true

  btn.textContent = '⏳ Collecting...'

  try {

    const res = await fetch(
      `${API_BASE}/collect-posts/2`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    )

    const data = await res.json()

    if (!res.ok) {
      throw new Error(
        data.detail || 'Collect failed'
      )
    }

    showToast(
      `✅ ${data.new_saved} new posts saved`
    )

    loadPosts()

  } catch(err) {

    showToast("❌ " + err.message)

  } finally {

    btn.disabled = false

    btn.textContent = '📥 Collect Posts'
  }
}

async function loadPosts() {

  showState('loading')

  const status =
    document.getElementById('api-status')

  try {

    const res = await fetch(
      `${API_BASE}/posts/2`,
      {
        headers: {
          Authorization: `Bearer ${TOKEN}`
        }
      }
    )

    const data = await res.json()

    if (!res.ok) {
      throw new Error(
        data.detail || 'Failed'
      )
    }

    allPosts = data.posts || []

    document.getElementById('stat-total').textContent =
      data.total || 0

    document.getElementById('stat-published').textContent =
      data.published || 0

    document.getElementById('stat-scheduled').textContent =
      data.scheduled || 0

    document.getElementById('stat-month').textContent =
      data.this_month || 0

    status.textContent = '🟢 Connected'

    status.className =
      'text-xs px-3 py-1 rounded-full bg-green-900 text-green-300'

    renderTable(allPosts)

  } catch(err) {

    status.textContent = '🔴 Offline'

    status.className =
      'text-xs px-3 py-1 rounded-full bg-red-900 text-red-300'

    document.getElementById('error-message').textContent =
      err.message

    showState('error')
  }
}

function exportCSV() {

  if (!allPosts.length) {

    showToast("⚠️ No data")

    return
  }

  const csv = [

    'Post ID,Caption,Post Time,Status,Image URL',

    ...allPosts.map(p => [

      p.post_id,

      (p.caption || '').replace(/"/g, '""'),

      p.post_time || '',

      isScheduled(p)
        ? 'Scheduled'
        : 'Published',

      p.image_url || ''

    ].map(v => `"${v}"`).join(','))

  ].join('\n')

  const a = document.createElement('a')

  a.href = URL.createObjectURL(
    new Blob([csv], { type: 'text/csv' })
  )

  a.download = 'fb_posts.csv'

  a.click()

  showToast("✅ CSV Exported")
}

/* FIRST LOAD */
loadPosts()

/* AUTO REFRESH EVERY 10 SEC */
setInterval(() => {

  loadPosts()

}, 10000)

</script>
